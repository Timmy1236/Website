<!DOCTYPE html>
<html lang="en">

<head>
  <title>Error 404 - Timmy</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon/favicon.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<style>
  .warning {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 999999;
    width: 100%;
    height: 100%;
  }

  .warning-image {
    pointer-events: none;
    margin-bottom: 10px;
  }

  .warning-text {
    color: red;
    width: 500px;
    margin: 0;
    margin-top: 10px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 16px;
  }

  .warning-link {
    text-decoration: underline;
    display: block;
  }
</style>

<body>
  <div class="warning">
    <img class="warning-image" src="assets/images/others/error.gif" alt="ERROR" />
    <p class="warning-text">ERROR 404: La pagina que estabas buscando, no existe. Posiblemente un link roto que dejo de funcionar.</p>
    <p class="warning-text">ERROR 404: The page you're looking for doesn't exist. It's likely a broken link that no longer works.</p>
    <a class="warning-text warning-link" href="javascript:history.back()">&lt;-- Go Back</a>
  </div>
</body>

</html>
